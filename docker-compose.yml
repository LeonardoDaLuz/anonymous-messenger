services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3046:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/app.db
      - MAX_MESSAGES=${MAX_MESSAGES:-100}
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3045:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
