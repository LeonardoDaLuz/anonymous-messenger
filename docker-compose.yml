services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3046:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/app.db
      - TRANSCRIBER_URL=http://transcriber:9000
      - KLIPY_API_KEY=${KLIPY_API_KEY:-} # busca de GIFs (Klipy); vazio = sem GIFs. Fica no .env
    volumes:
      - db-data:/data
    restart: unless-stopped

  # Whisper (faster-whisper, CPU). Só o backend acessa: sem porta publicada.
  transcriber:
    build:
      context: ./transcriber
      args:
        WHISPER_MODEL: small # tiny | base | small | medium
    environment:
      - WHISPER_LANGUAGE=pt # vazio = detectar o idioma sozinho (mais lento e erra em áudios curtos)
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # A porta fica restrita ao host; o acesso público passa pelo Nginx HTTPS.
      - "127.0.0.1:3045:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
