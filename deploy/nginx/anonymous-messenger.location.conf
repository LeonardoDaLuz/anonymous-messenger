location = /anonymous-messenger {
    return 301 /anonymous-messenger/;
}

location /anonymous-messenger/ {
    # A barra final remove o prefixo antes de encaminhar ao Nginx do frontend.
    proxy_pass http://127.0.0.1:3045/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /anonymous-messenger;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Restringe o cookie de sessão ao caminho deste aplicativo.
    proxy_cookie_path / /anonymous-messenger/;
}
